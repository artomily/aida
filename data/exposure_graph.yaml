# Curated SGX <-> IDX relationships — the Exposure (Base) component reads only this file.
#
# Every row links one SGX-listed entity to the IDX sector it structurally touches, and to a
# specific IDX emiten when there is one. Stakes are approximate and drift with every placement
# or buyback: they document *why* a row exists, they are not used in the score. Rows marked
# `verified: false` still need a check against the latest annual report / keterbukaan
# informasi; the daily job also cross-checks `holder_name` in IDX ownership filings against
# `data/entity_aliases.yaml` and reports matches on the methodology page.
#
# relation → weight (see README, "Exposure"):
#   parent                    1.0  SGX entity controls the IDX emiten (or the reverse)
#   significant_shareholder   0.7  non-controlling but material stake, incl. indirect control
#   sgx_listed_id_operations  0.6  SGX-listed, primary operations in Indonesia
#   commodity_trade           0.4  shared commodity / trade channel
#   board_overlap             0.2  same group or shared directors only

relation_weights:
  parent: 1.0
  significant_shareholder: 0.7
  sgx_listed_id_operations: 0.6
  commodity_trade: 0.4
  board_overlap: 0.2

# Approximate rate, used only to set an SGX-only company's market cap (SGD) against its IDX
# sector's (IDR). A 5% error here moves those rows' contribution by 5%, nothing else.
fx:
  sgd_idr: 12500

relationships:
  # ── industrials: Jardine → Astra ──
  - sgx_entity: C07.SI
    idx_symbol: ASII.JK
    sector: industrials
    relation: parent
    stake: 0.5
    source: Jardine Cycle & Carriage holds ~50% of Astra International
    verified: false
  - sgx_entity: J36.SI
    idx_symbol: ASII.JK
    sector: industrials
    relation: significant_shareholder
